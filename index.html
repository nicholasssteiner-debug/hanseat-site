<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanseat</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1f; --muted:#6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9f; } }
  html,body { height:100%; margin:0; }
  body { display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:0 16px; text-align:center; }
  h1 { font-size:clamp(2rem,6vw,3.5rem); letter-spacing:.04em; margin:0 0 .5rem; }
  p { color:var(--muted); margin:0; }
</style>
</head>
<body>
  <main>
    <h1>Hanseat</h1>
    <p>Site em construção.</p>
  </main>
</body>
</html>
